<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Asher Tian — Dark landscape banner</title>
  <desc id="desc">A centered personal identity over a quiet, layered blue-green mountain landscape with a restrained cinnabar accent.</desc>
  <defs>
