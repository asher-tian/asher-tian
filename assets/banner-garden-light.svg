    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E7E0D0"/><stop offset="1" stop-color="#C9C8B7"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#899486"/><stop offset="1" stop-color="#647365"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C7C5B3"/><stop offset="1" stop-color="#929D8E"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EAF0E3"/><stop offset="1" stop-color="#C7D9C9"/></linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B5CDBB"/><stop offset="1" stop-color="#7FA591"/></linearGradient>
