<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Asher Tian — Jiangnan Garden, Light</title>
  <desc id="desc">A richly layered Jiangnan courtyard panorama with a moon gate, tiled garden walls, lattice windows, bamboo, plum blossoms, pavilion, rocks and a reflecting pond.</desc>
  <defs>
