    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F8F6EB" stop-opacity=".02"/><stop offset=".5" stop-color="#F8F6EB" stop-opacity=".58"/><stop offset="1" stop-color="#F8F6EB" stop-opacity=".04"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="62%"><stop stop-color="#FFFDF4" stop-opacity=".6"/><stop offset="1" stop-color="#FFFDF4" stop-opacity="0"/></radialGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r=".55" fill="#8A806D" opacity=".12"/>
      <circle cx="20" cy="19" r=".45" fill="#8A806D" opacity=".1"/>
    </pattern>
    <clipPath id="gate"><circle cx="600" cy="105" r="88"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="220" rx="16"/></clipPath>
  </defs>

